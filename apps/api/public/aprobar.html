<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aprobar con passkey</title>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#1d1b16;--muted:#6b665c;--line:#e4ded2;--brand:#0f6b4f;--brand-ink:#fff;--ok:#0f6b4f;--ok-bg:#e1f3ea;--bad:#a1271b;--bad-bg:#fde8e5;--chip:#efe9dd}
@media (prefers-color-scheme: dark){:root{--bg:#141412;--panel:#1d1c19;--ink:#efeae0;--muted:#a39d91;--line:#33302a;--brand:#3cc492;--brand-ink:#08130e;--ok:#59d7a6;--ok-bg:#143326;--bad:#ff8a7d;--bad-bg:#3d1a16;--chip:#2a2824}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:24px 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:440px;width:100%}
h1{font-size:20px;margin:0 0 4px}
p{margin:8px 0}
.muted{color:var(--muted);font-size:13px}
.what{background:var(--chip);border-radius:12px;padding:12px;margin:14px 0;font-weight:600}
.hash{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all;color:var(--muted)}
label{display:block;font-size:13px;color:var(--muted);margin-top:10px}
input,select{width:100%;font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px;margin-top:16px;cursor:pointer;background:var(--brand);color:var(--brand-ink)}
button.ghost{background:var(--chip);color:var(--ink);font-weight:500}
button:disabled{opacity:.5}
.msg{border-radius:10px;padding:10px;margin-top:12px;display:none}
.msg.ok{display:block;background:var(--ok-bg);color:var(--ok)}
.msg.bad{display:block;background:var(--bad-bg);color:var(--bad)}
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Aprobar con passkey</h1>
  <p class="muted">Tu huella o rostro firma exactamente lo que ves abajo. Si algo cambia, la firma deja de valer.</p>

  <div id="mandate-form" hidden>
    <label>Proveedor<select id="payee"></select></label>
    <div class="row">
      <label>Tope por pago ($)<input id="perop" type="number" min="1" step="0.01" value="1500"></label>
      <label>Tope por periodo ($)<input id="cap" type="number" min="1" step="0.01" value="3000"></label>
    </div>
    <div class="row">
      <label>Periodo<select id="period"><option value="week">Semana</option><option value="day">Día</option><option value="month">Mes</option></select></label>
      <label>Vigencia (días)<input id="days" type="number" min="1" max="365" value="90"></label>
    </div>
    <button id="prepare" type="button" class="ghost">Revisar mandato</button>
  </div>

  <div id="review" hidden>
    <div class="what" id="summary"></div>
    <p class="hash">hash: <span id="hash"></span></p>
    <button id="sign" type="button">Firmar con passkey</button>
  </div>

  <button id="register" type="button" class="ghost" hidden>Registrar mi passkey en este dispositivo</button>
  <div id="out" class="msg"></div>
</div>
<script src="https://unpkg.com/@simplewebauthn/browser@13.3.0/dist/bundle/index.umd.min.js"></script>
<script>
const { startRegistration, startAuthentication } = SimpleWebAuthnBrowser;
const $ = (s) => document.querySelector(s);
let proposalId = location.pathname.startsWith("/aprobar/") ? decodeURIComponent(location.pathname.split("/")[2]) : null;

const say = (t, ok) => { const o = $("#out"); o.textContent = t; o.className = "msg " + (ok ? "ok" : "bad"); };
async function api(url, body) {
  const r = await fetch(url, body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Error " + r.status);
  return j;
}

async function ensurePasskey() {
  const s = await api("/api/passkey/status");
  $("#register").hidden = s.registered;
  return s.registered;
}
$("#register").onclick = async () => {
  try {
    const opts = await api("/api/passkey/register/options", {});
    const resp = await startRegistration({ optionsJSON: opts });
    await api("/api/passkey/register/verify", resp);
    say("Passkey registrada. Ya puedes firmar.", true);
    $("#register").hidden = true;
  } catch (e) { say(e.message || String(e)); }
};

async function showProposal(id) {
  const p = await api("/api/proposal/" + encodeURIComponent(id));
  $("#title").textContent = p.type === "CreateMandate" ? "Firmar mandato" : "Aprobar pago";
  $("#summary").textContent = p.summary;
  $("#hash").textContent = p.hash;
  $("#review").hidden = false;
  if (p.provenance === "third_party_content") say("Ojo: esta instrucción vino de una foto, documento o mensaje reenviado. Revísala bien.");
  const okStatus = (p.type === "CreateMandate" && p.status === "pending") || (p.type === "PayoutRequest" && p.status === "awaiting_passkey");
  if (!okStatus) { $("#sign").disabled = true; say("Esta propuesta ya no se puede aprobar (estado: " + p.status + ")."); }
}

$("#prepare").onclick = async () => {
  try {
    const r = await api("/api/mandate/propose", {
      payee_id: $("#payee").value,
      per_op_pesos: Number($("#perop").value),
      period_cap_pesos: Number($("#cap").value),
      period: $("#period").value,
      valid_days: Number($("#days").value),
    });
    proposalId = r.id;
    $("#mandate-form").hidden = true;
    await showProposal(proposalId);
  } catch (e) { say(e.message); }
};

$("#sign").onclick = async () => {
  $("#sign").disabled = true;
  try {
    if (!(await ensurePasskey())) { say("Primero registra tu passkey."); $("#sign").disabled = false; return; }
    const opts = await api("/api/approve/options", { proposal_id: proposalId });
    const resp = await startAuthentication({ optionsJSON: opts });
    const r = await api("/api/approve/verify", { proposal_id: proposalId, response: resp });
    say("✅ Firmado. " + r.summary + " Ya puedes volver al chat.", true);
  } catch (e) { say(e.message || String(e)); $("#sign").disabled = false; }
};

(async () => {
  await ensurePasskey();
  if (proposalId) { await showProposal(proposalId).catch((e) => say(e.message)); return; }
  const payees = await api("/api/payees");
  $("#payee").innerHTML = payees.map((p) => `<option value="${p.id}">${p.alias} (CLABE ••••${p.clabe_last4})</option>`).join("");
  $("#title").textContent = "Nuevo mandato";
  $("#mandate-form").hidden = false;
})();
</script>
</body>
</html>
