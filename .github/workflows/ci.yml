# Typecheck y tests en cada push y pull request. Los tests de base de datos corren con PGlite
# (Postgres en proceso), así que no hace falta un servicio de Postgres ni secretos.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Mexico_City
    steps:
      - uses: actions/checkout@v4
      # Toma la versión de pnpm del campo packageManager de package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
